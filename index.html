<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
        #avatar { 
            width: 300px; height: 300px; 
            background: url('Avtaar.gif') no-repeat center center; 
            background-size: contain;
            margin: 20px auto;
            border: 2px solid #00ff00;
        }
    </style>
</head>
<body>
    <h1>JARVIS ONLINE</h1>
    <div id="avatar"></div>
    <p id="status">System: Ready</p>
    <script>
        const MY_API_KEY = "YOUR_API_KEY_HERE"; // Yahan apni key daal dena
        const status = document.getElementById('status');

        async function jarvis(text) {
            status.innerText = "Thinking...";
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${MY_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "You are Jarvis. Reply in short Hinglish: " + text }] }] })
            });
            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            status.innerText = "Jarvis: " + reply;
            const s = new SpeechSynthesisUtterance(reply);
            window.speechSynthesis.speak(s);
        }

        // Voice recognition code yahan aayega...
    </script>
</body>
</html>
